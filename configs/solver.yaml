# ALL values are PROVISIONAL examples, not validated physical/numerical limits.
schema_version: 1
provisional: true
design_space:
  aspect_ratio: [4.0, 12.0]
  area_m2: [0.2, 2.0]  # Full-wing planform area
  taper_ratio: [0.3, 1.0]
  tip_twist_deg: [-3.0, 0.0]  # Linear twist from zero at the root; negative is washout
  airfoils: [naca0012, naca2412, naca4412]
operating_conditions:
  alpha_deg: [-4.0, 12.0]
  velocity_m_s: [10.0, 50.0]
  beta_deg: 0.0
  density_kg_m3: 1.225
  dynamic_viscosity_pa_s: 0.00001789
  speed_of_sound_m_s: 340.0
sampling:
  method: latin_hypercube  # TODO: implement and validate
  n_geometries: 100
  states_per_geometry: 20
  seed: 4452
solver:
  method: nonlinear_polar_corrected_vlm  # Experimental section boundary correction
  spanwise_panels: 20  # Per semispan; full wing has twice this many strips
  chordwise_panels: 4
  max_iterations: 100
  residual_tolerance: 0.000001
  relaxation: 0.3
  vortex_core_radius_m: 0.00000001
polars:
  backend: neuralfoil
  model_size: large
  alpha_deg_bounds: [-20.0, 20.0]
  alpha_step_deg: 0.5
  n_crit: 9.0
  xtr_upper: 1.0
  xtr_lower: 1.0
  minimum_confidence: 0.9  # TODO: validate choice
  out_of_domain: reject
  cache_dir: data/raw/polar_cache
output:
  root: data/raw
  format: csv
  retain_all_attempts: true
  overwrite: false
